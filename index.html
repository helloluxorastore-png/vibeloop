<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101a">
<title>VibeLoop</title>

<style>
:root {
  color-scheme: dark;
  --bg: #10101a;
  --panel: #1c1c2b;
  --accent: #a78bfa;
  --muted: #aaa9c0;
  --border: #36364c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: #f7f5ff;
  font-family: system-ui, Arial, sans-serif;
}

header {
  padding: 18px;
  background: #171725;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  font-size: 26px;
  font-weight: 900;
}

.brand span { color: var(--accent); }

main {
  width: min(700px, 100%);
  margin: auto;
  padding: 16px 12px 90px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

input, textarea, button {
  font: inherit;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  background: #11111d;
  color: white;
  border: 1px solid #46465c;
  border-radius: 10px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  padding: 10px 14px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: #171225;
  font-weight: 700;
  cursor: pointer;
}

button.secondary {
  background: #303047;
  color: white;
}

button:disabled {
  opacity: .5;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.muted {
  color: var(--muted);
  font-size: 14px;
}

.status {
  overflow-wrap: anywhere;
  font-size: 14px;
}

.post {
  border-top: 1px solid var(--border);
  padding: 15px 0;
}

.post:first-child {
  border-top: 0;
}

.post-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 12px 0;
}

.post-media {
  display: block;
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  border-radius: 12px;
  background: #08080d;
  margin-top: 10px;
}

.hidden { display: none !important; }

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  background: #171725f5;
  border-top: 1px solid var(--border);
  z-index: 10;
}

nav button {
  flex: 1;
  max-width: 150px;
}

.comment {
  border-top: 1px solid var(--border);
  padding: 8px 0;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
  <div class="brand">Vibe<span>Loop</span> ✦</div>
  <div class="muted">Your space. Your people. Your vibe.</div>
</header>

<main>

  <section class="panel" id="authPanel">
    <h2>Welcome to VibeLoop</h2>
    <input id="email" type="email" autocomplete="email"
           placeholder="Email address">
    <input id="password" type="password"
           autocomplete="current-password"
           placeholder="Password (at least 6 characters)">

    <div class="actions">
      <button id="signupBtn">Create account</button>
      <button id="loginBtn" class="secondary">Log in</button>
      <button id="logoutBtn" class="secondary hidden">Log out</button>
    </div>

    <p id="authStatus" class="status"></p>
  </section>

  <section class="panel hidden" id="profilePanel">
    <h2>Your profile</h2>
    <input id="displayName" maxlength="40"
           placeholder="Display name">
    <textarea id="bio" maxlength="180"
              placeholder="Tell people about yourself"></textarea>
    <label class="muted">Profile photo</label>
    <input id="avatarFile" type="file" accept="image/*">
    <button id="saveProfileBtn">Save profile</button>
    <p id="profileStatus" class="status"></p>
  </section>

  <section class="panel hidden" id="composer">
    <h2>Share your vibe</h2>
    <textarea id="postText" maxlength="1500"
              placeholder="What's on your mind?"></textarea>
    <label class="muted">Attach a photo or video</label>
    <input id="mediaFile" type="file" accept="image/*,video/*">
    <p class="muted">Large videos may require a strong connection and suitable Firebase Storage configuration.</p>
    <button id="publishBtn">Publish post</button>
    <p id="publishStatus" class="status"></p>
  </section>

  <section class="panel">
    <h2 id="feedHeading">Your feed</h2>
    <p id="feedStatus" class="status">Connecting to VibeLoop…</p>
    <div id="feed"></div>
  </section>

  <section class="panel hidden" id="discoverPanel">
    <h2>Discover people</h2>
    <input id="searchInput" placeholder="Search profiles">
    <div id="searchResults"></div>
  </section>

</main>

<nav>
  <button data-page="feed">Home</button>
  <button data-page="videos" class="secondary">Videos</button>
  <button data-page="discover" class="secondary">Discover</button>
  <button data-page="profile" class="secondary">Profile</button>
</nav>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  addDoc,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
  deleteDoc,
  updateDoc,
  increment,
  getDocs
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

/* Your existing VibeLoop Firebase project */
const firebaseConfig = {
  apiKey: "AIzaSyAWPVj-XIvnc2S79jVbNjcjVAMPMMiwq5g",
  authDomain: "vibeloop-d1408.firebaseapp.com",
  projectId: "vibeloop-d1408",
  storageBucket: "vibeloop-d1408.firebasestorage.app",
  messagingSenderId: "494934558215",
  appId: "1:494934558215:web:8dd05a12acec25b0d88ca2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let currentProfile = {};
let posts = [];
let currentPage = "feed";
let stopFeed = null;

function message(id, text) {
  $(id).textContent = text;
}

function errorMessage(error) {
  const code = error?.code || "";

  if (code.includes("permission-denied"))
    return "Firestore denied access. Secure database rules need to be configured.";

  if (code.includes("storage/unauthorized"))
    return "Storage denied the upload. Check Firebase Storage rules.";

  if (code.includes("auth/email-already-in-use"))
    return "That email already has an account. Try logging in.";

  if (code.includes("auth/invalid-email"))
    return "Enter a valid email address.";

  if (code.includes("auth/weak-password"))
    return "Use a password with at least 6 characters.";

  if (code.includes("auth/invalid-credential"))
    return "Email or password is incorrect.";

  return error?.message || "Something went wrong. Please try again.";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

$("signupBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  message("authStatus", "Creating account…");

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    const displayName = email.split("@")[0];

    try {
      await setDoc(doc(db, "users", result.user.uid), {
        uid: result.user.uid,
        email,
        displayName,
        bio: "",
        photoURL: "",
        createdAt: serverTimestamp()
      });

      message("authStatus", "Account created successfully.");
    } catch (error) {
      message("authStatus",
        "Your account was created, but Firestore blocked the profile save. Check database rules.");
    }
  } catch (error) {
    message("authStatus", errorMessage(error));
  }
});

$("loginBtn").addEventListener("click", async () => {
  message("authStatus", "Logging in…");

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );

    message("authStatus", "Logged in successfully.");
  } catch (error) {
    message("authStatus", errorMessage(error));
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    message("authStatus", "Logged out.");
  } catch (error) {
    message("authStatus", errorMessage(error));
  }
});

onAuthStateChanged(auth, async user => {
  currentUser = user;

  $("authPanel").classList.toggle("hidden", !!user);
  $("composer").classList.toggle("hidden", !user);
  $("profilePanel").classList.toggle("hidden", !user);
  $("logoutBtn").classList.toggle("hidden", !user);

  if (user) {
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      currentProfile = snap.exists() ? snap.data() : {};

      $("displayName").value =
        currentProfile.displayName || user.email.split("@")[0];

      $("bio").value = currentProfile.bio || "";
    } catch (error) {
      message("profileStatus", errorMessage(error));
    }
  } else {
    currentProfile = {};
  }

  loadFeed();
});

async function loadFeed() {
  if (stopFeed) stopFeed();

  message("feedStatus", "Loading posts…");

  try {
    stopFeed = onSnapshot(
      query(collection(db, "posts"),
        orderBy("createdAt", "desc"), limit(50)),
      snapshot => {
        posts = snapshot.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));

        renderFeed();
      },
      error => message("feedStatus", errorMessage(error))
    );
  } catch (error) {
    message("feedStatus", errorMessage(error));
  }
}

function renderFeed() {
  const container = $("feed");
  container.replaceChildren();

  const visiblePosts = posts.filter(post =>
    currentPage !== "videos" || post.mediaType === "video"
  );

  if (!visiblePosts.length) {
    message("feedStatus", currentPage === "videos"
      ? "No videos yet."
      : "No posts yet. Be the first to share something!");
    return;
  }

  message("feedStatus", "");

  visiblePosts.forEach(post => {
    const article = document.createElement("article");
    article.className = "post";

    const author = escapeHTML(
      post.displayName || post.email || "VibeLoop member"
    );

    let media = "";

    if (post.mediaURL && post.mediaType === "video") {
      media = `<video class="post-media" controls playsinline
        preload="metadata" src="${escapeHTML(post.mediaURL)}"></video>`;
    } else if (post.mediaURL) {
      media = `<img class="post-media"
        src="${escapeHTML(post.mediaURL)}" alt="Post image">`;
    }

    article.innerHTML = `
      <strong>${author}</strong>
      <div class="post-text">${escapeHTML(post.text || "")}</div>
      ${media}
      <div class="actions">
        <button class="secondary likeBtn">♥ ${Number(post.likes || 0)} Like</button>
        ${currentUser && currentUser.uid === post.uid
          ? '<button class="secondary deleteBtn">Delete</button>'
          : ''}
      </div>
    `;

    article.querySelector(".likeBtn").addEventListener("click", async () => {
      if (!currentUser) {
        message("feedStatus", "Log in to like posts.");
        return;
      }

      const likeRef = doc(
        db, "posts", post.id, "likes", currentUser.uid
      );

      try {
        const existing = await getDoc(likeRef);

        if (existing.exists()) {
          await deleteDoc(likeRef);
          await updateDoc(doc(db, "posts", post.id), {
            likes: increment(-1)
          });
        } else {
          await setDoc(likeRef, {
            uid: currentUser.uid,
            createdAt: serverTimestamp()
          });

          await updateDoc(doc(db, "posts", post.id), {
            likes: increment(1)
          });
        }
      } catch (error) {
        message("feedStatus", errorMessage(error));
      }
    });

    const deleteBtn = article.querySelector(".deleteBtn");

    if (deleteBtn) {
      deleteBtn.addEventListener("click", async () => {
        if (!confirm("Delete your post?")) return;

        try {
          await deleteDoc(doc(db, "posts", post.id));
        } catch (error) {
          message("feedStatus", errorMessage(error));
        }
      });
    }

    container.appendChild(article);
  });
}

$("publishBtn").addEventListener("click", async () => {
  if (!currentUser) return;

  const text = $("postText").value.trim();
  const file = $("mediaFile").files[0];

  if (!text && !file) {
    message("publishStatus", "Write something or select a photo/video.");
    return;
  }

  if (file && file.size > 100 * 1024 * 1024) {
    message("publishStatus", "Choose a file under 100 MB.");
    return;
  }

  const button = $("publishBtn");
  button.disabled = true;

  try {
    let mediaURL = "";
    let mediaType = "";

    if (file) {
      message("publishStatus", "Uploading media…");

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const fileRef = ref(
        storage,
        `posts/${currentUser.uid}/${Date.now()}-${safeName}`
      );

      await uploadBytes(fileRef, file);
      mediaURL = await getDownloadURL(fileRef);
      mediaType = file.type.startsWith("video/") ? "video" : "image";
    }

    await addDoc(collection(db, "posts"), {
      uid: currentUser.uid,
      email: currentUser.email || "",
      displayName: currentProfile.displayName ||
        currentUser.email.split("@")[0],
      text,
      mediaURL,
      mediaType,
      likes: 0,
      createdAt: serverTimestamp()
    });

    $("postText").value = "";
    $("mediaFile").value = "";
    message("publishStatus", "Post published successfully.");
    currentPage = mediaType === "video" ? "videos" : "feed";
    renderFeed();
  } catch (error) {
    message("publishStatus", errorMessage(error));
  } finally {
    button.disabled = false;
  }
});

$("saveProfileBtn").addEventListener("click", async () => {
  if (!currentUser) return;

  const displayName = $("displayName").value.trim();
  const bio = $("bio").value.trim();
  const file = $("avatarFile").files[0];

  if (!displayName) {
    message("profileStatus", "Enter a display name.");
    return;
  }

  if (file && file.size > 5 * 1024 * 1024) {
    message("profileStatus", "Choose a profile photo under 5 MB.");
    return;
  }

  const button = $("saveProfileBtn");
  button.disabled = true;

  try {
    let photoURL = currentProfile.photoURL || "";

    if (file) {
      if (!file.type.startsWith("image/")) {
        throw new Error("Choose an image for your profile photo.");
      }

      const fileRef = ref(
        storage,
        `profilePhotos/${currentUser.uid}/${Date.now()}-${file.name}`
      );

      await uploadBytes(fileRef, file);
      photoURL = await getDownloadURL(fileRef);
    }

    await setDoc(doc(db, "users", currentUser.uid), {
      uid: currentUser.uid,
      email: currentUser.email || "",
      displayName,
      bio,
      photoURL,
      updatedAt: serverTimestamp()
    }, { merge: true });

    await updateProfile(currentUser, {
      displayName,
      photoURL
    });

    currentProfile = { ...currentProfile, displayName, bio, photoURL };
    message("profileStatus", "Profile saved.");
  } catch (error) {
    message("profileStatus", errorMessage(error));
  } finally {
    button.disabled = false;
  }
});

$("searchInput").addEventListener("input", async () => {
  const term = $("searchInput").value.trim().toLowerCase();
  const results = $("searchResults");
  results.replaceChildren();

  if (!term) return;

  try {
    const snapshot = await getDocs(
      query(collection(db, "users"), limit(100))
    );

    snapshot.forEach(d => {
      const profile = d.data();

      if (d.id === currentUser?.uid) return;

      const name = profile.displayName || "";
      const bio = profile.bio || "";

      if (!(name + " " + bio).toLowerCase().includes(term)) return;

      const item = document.createElement("div");
      item.className = "search-result";
      item.innerHTML = `
        <strong>${escapeHTML(name || "VibeLoop member")}</strong>
        <p class="muted">${escapeHTML(bio)}</p>
        <button class="secondary">Follow</button>
      `;

      item.querySelector("button").addEventListener("click", async () => {
        if (!currentUser) {
          message("feedStatus", "Log in to follow people.");
          return;
        }

        try {
          await setDoc(
            doc(db, "users", currentUser.uid, "following", d.id),
            { uid: d.id, createdAt: serverTimestamp() }
          );

          item.querySelector("button").textContent = "Following";
        } catch (error) {
          message("feedStatus", errorMessage(error));
        }
      });

      results.appendChild(item);
    });
  } catch (error) {
    message("feedStatus", errorMessage(error));
  }
});

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    currentPage = button.dataset.page;

    $("feed").classList.toggle("hidden", currentPage === "discover");
    $("discoverPanel").classList.toggle("hidden", currentPage !== "discover");
    $("profilePanel").classList.toggle(
      "hidden", currentPage !== "profile" || !currentUser
    );
    $("composer").classList.toggle("hidden", !currentUser ||
      currentPage === "discover" || currentPage === "profile");

    $("feedHeading").textContent =
      currentPage === "videos" ? "Video Loop" : "Your feed";

    if (currentPage !== "discover") renderFeed();
  });
});
</script>
</body>
</html>
